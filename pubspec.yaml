name: mengliyevsebook
description: "BookHub — open e-book platform"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  dio: ^5.9.0
  logger: ^2.6.2
  permission_handler: ^12.0.1
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2
  easy_localization: ^3.0.8
  toastification: ^3.0.3
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.5
  firebase_crashlytics: ^5.0.3
  # icons_launcher: ^3.0.3
  firebase_auth: ^6.1.1
  email_validator: ^3.0.0
  cloud_firestore: ^6.0.3
  google_sign_in: ^7.2.0
  flutter_svg: ^2.2.1
  url_launcher: ^6.3.2
  pinput: ^5.0.2
  smart_auth: ^3.2.0
  otp_timer_button: ^1.1.1
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  http_parser: ^4.1.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  archive: ^4.0.7
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3







 



  # icons_launcher: ^3.0.1

 
  



dev_dependencies:
  flutter_test:
    sdk: flutter

# icons_launcher:
#   image_path: "assets/images/logo.png"
#   platforms:
#     android:
#       enable: true
#     ios:
#       enable: true


  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/lucide/
    - assets/fonts/
    - assets/reader/

  fonts:
    # Interface (Latin, Uzbek, Cyrillic incl. Ў Қ Ғ Ҳ)
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    # Titles and book typography (Ҳ falls back to Lora)
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-400.ttf
        - asset: assets/fonts/Literata-400Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-600.ttf
          weight: 600
        - asset: assets/fonts/Literata-700.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
        - asset: assets/fonts/Lora-400Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-700.ttf
          weight: 700


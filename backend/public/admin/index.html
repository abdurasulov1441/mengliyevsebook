<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%238a5a2b%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-weight=%22bold%22%3EM%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mengliyev's eBook — Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="logo">M</span><div><b>Mengliyev's eBook</b><small>Boshqaruv paneli</small></div></div>
    <label>Telefon<input name="phone" type="tel" placeholder="+998 90 123 45 67" autocomplete="username" required></label>
    <label>Parol<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Kirish</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">M</span><div><b>Mengliyev's eBook</b><small>Admin</small></div></div>
    <nav id="nav">
      <a href="#/dashboard" data-route="dashboard"><i data-ic="home"></i>Asosiy</a>
      <a href="#/books" data-route="books"><i data-ic="book"></i>Kitoblar</a>
      <a href="#/payments" data-route="payments"><i data-ic="card"></i>To'lovlar <span class="pill hidden" id="pendingBadge"></span></a>
      <a href="#/users" data-route="users"><i data-ic="users"></i>Foydalanuvchilar</a>
      <a href="#/authors" data-route="authors"><i data-ic="pen"></i>Mualliflar</a>
      <a href="#/categories" data-route="categories"><i data-ic="tag"></i>Kategoriyalar</a>
      <a href="#/settings" data-route="settings"><i data-ic="gear"></i>Sozlamalar</a>
    </nav>
    <div class="side-foot"><div id="me"></div><button class="btn ghost sm" id="logout">Chiqish</button></div>
  </aside>
  <div class="scrim" id="sideScrim"></div>
  <main class="main">
    <header class="top"><button class="icon-btn" id="menuBtn" aria-label="Menu"><i data-ic="menu"></i></button><h1 id="pageTitle"></h1><div id="topActions" class="top-actions"></div></header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="modal-wrap hidden" id="modal"><div class="modal" role="dialog"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-close aria-label="Yopish"><i data-ic="x"></i></button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<div class="lightbox hidden" id="lightbox"><img alt=""></div>
<script src="admin.js"></script>
</body>
</html>

<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="icon" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookHub — Boshqaruv paneli</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm">
    <div class="brand"><img class="logo" src="logo.png" alt=""><div><b>BookHub</b><small>Boshqaruv paneli</small></div></div>
    <div class="tabs" id="loginTabs"><button type="button" data-mode="sms">SMS kod</button><button type="button" data-mode="password">Parol</button></div>
    <label>Telefon<input name="phone" type="tel" placeholder="+998 90 123 45 67" autocomplete="username" required></label>
    <label id="codeField" class="hidden">SMS kod<input name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <label id="pwdField" class="hidden">Parol<input name="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary block" type="submit" id="loginBtn">Kirish</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="shell" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand"><img class="logo" src="logo.png" alt=""><div><b>BookHub</b><small>Admin</small></div></div>
    <nav id="nav">
      <a href="#/dashboard" data-route="dashboard"><i data-ic="home"></i>Asosiy</a>
      <a href="#/moderation" data-route="moderation"><i data-ic="shield"></i>Moderatsiya <span class="pill hidden" id="pendingBadge"></span></a>
      <a href="#/authors" data-route="authors"><i data-ic="pen"></i>Mualliflar</a>
      <a href="#/payouts" data-route="payouts"><i data-ic="wallet"></i>To'lovlar</a>
      <a href="#/orders" data-route="orders"><i data-ic="receipt"></i>Buyurtmalar</a>
      <a href="#/users" data-route="users"><i data-ic="users"></i>Foydalanuvchilar</a>
      <a href="#/categories" data-route="categories"><i data-ic="tag"></i>Kategoriyalar</a>
      <a href="#/settings" data-route="settings"><i data-ic="gear"></i>Sozlamalar</a>
      <a href="/api/docs" target="_blank"><i data-ic="book"></i>API (Swagger)</a>
    </nav>
    <div class="side-foot"><div id="me"></div><button class="btn ghost sm" id="logout">Chiqish</button></div>
  </aside>
  <div class="scrim" id="sideScrim"></div>
  <main class="main">
    <header class="top"><button class="icon-btn" id="menuBtn" aria-label="Menu"><i data-ic="menu"></i></button><h1 id="pageTitle"></h1><div id="topActions" class="top-actions"></div></header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="modal-wrap hidden" id="modal"><div class="modal" role="dialog"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-close aria-label="Yopish"><i data-ic="x"></i></button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<div class="lightbox hidden" id="lightbox"><img alt=""></div>
<script src="admin.js"></script>
</body>
</html>

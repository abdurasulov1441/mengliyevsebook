<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%238a5a2b%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22 font-weight=%22bold%22%3EM%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mengliyev's eBook — Kutubxona</title>
<style>
  :root { --bg:#f6f3ee; --card:#fff; --fg:#1f1d1a; --muted:#7a746b; --line:rgba(0,0,0,.08); --accent:#8a5a2b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --card:#232427; --fg:#e6e3dc; --muted:#8d8a83; --line:rgba(255,255,255,.08); --accent:#d9a46b; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding: calc(env(safe-area-inset-top,0px) + 22px) 16px 10px; max-width: 1100px; margin: 0 auto; display:flex; align-items:center; gap:14px; }
  header .logo { width:44px; height:44px; border-radius:12px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font:700 20px Georgia,serif; flex:0 0 auto; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .wrap { max-width:1100px; margin:0 auto; padding: 0 16px 40px; }
  .search { width:100%; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--card); padding:0 14px; font-size:16px; color:inherit; margin: 6px 0 18px; outline:none; }
  .search:focus { border-color: var(--accent); }
  .continue { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:22px; text-decoration:none; color:inherit; }
  .continue .cover { width:58px; flex:0 0 58px; }
  .continue small { color:var(--muted); display:block; margin-bottom:3px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .continue b { display:block; font-size:16px; margin-bottom:6px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
  .book { text-decoration:none; color:inherit; display:block; }
  .cover { aspect-ratio: 2/3; border-radius: 6px 10px 10px 6px; overflow:hidden; position:relative; box-shadow: 0 6px 18px rgba(0,0,0,.18), inset 4px 0 0 rgba(0,0,0,.12); background:#555; }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover .gen { position:absolute; inset:0; padding: 14% 10% 10%; display:flex; flex-direction:column; justify-content:space-between; color:#fff; font-family: Georgia, serif; }
  .cover .gen .t { font-size: clamp(13px, 2.2vw, 17px); font-weight:700; line-height:1.2; text-shadow:0 1px 2px rgba(0,0,0,.3); overflow:hidden; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; }
  .cover .gen .a { font-size: 11px; opacity:.85; font-family: system-ui, sans-serif; }
  .cover .gen::before { content:""; position:absolute; left:10%; right:10%; top:7%; height:2px; background:rgba(255,255,255,.5); }
  .progress { height:3px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden; }
  .progress i { display:block; height:100%; background:var(--accent); }
  .title { font-weight:600; font-size:14px; margin-top:8px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .empty { text-align:center; color:var(--muted); padding: 60px 20px; line-height:1.6; }
  code { background: var(--card); padding: 2px 6px; border-radius: 6px; border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <div><h1>Mengliyev's eBook</h1><p id="sub">Oflayn kutubxona</p></div>
</header>
<div class="wrap">
  <input class="search" id="q" type="search" placeholder="Kitob yoki muallif…">
  <div id="cont"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="books.js" onerror="window.MBOOKS=window.MBOOKS||[]"></script>
<script>
(function () {
  var books = window.MBOOKS || [];
  var grid = document.getElementById('grid');
  var palette = [['#7b4a2a','#b7794a'],['#2f4b6e','#5b82b0'],['#3d5a40','#6f9a6f'],['#6b2f45','#a65977'],['#4a3f6b','#7d6fb0'],['#5c4a1f','#9c8340']];
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function progress(id){try{var d=JSON.parse(localStorage.getItem('mbook:'+id)||'{}');return d}catch(e){return{}}}
  function cover(b){
    if (b.cover) return '<div class="cover"><img src="'+esc(b.id+'/'+b.cover)+'" alt="" loading="lazy"></div>';
    var h=0; for (var i=0;i<b.id.length;i++) h=(h*31+b.id.charCodeAt(i))>>>0;
    var p=palette[h%palette.length];
    return '<div class="cover" style="background:linear-gradient(160deg,'+p[1]+','+p[0]+')"><div class="gen"><div class="t">'+esc(b.title)+'</div><div class="a">'+esc((b.authors||[]).join(', '))+'</div></div></div>';
  }
  function render(q){
    q=(q||'').toLowerCase();
    var list=books.filter(function(b){return !q||(b.title+' '+(b.authors||[]).join(' ')).toLowerCase().indexOf(q)>=0});
    document.getElementById('sub').textContent = books.length + ' ta kitob · oflayn';
    if(!books.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Kitoblar yo\'q.<br>Konvertatsiya qiling: <code>npm run convert -- "kitob.docx"</code></div>';return}
    grid.innerHTML=list.map(function(b){
      var pr=progress(b.id), pct=Math.round((pr.percent||0)*100);
      return '<a class="book" href="reader.html?book='+encodeURIComponent(b.id)+'">'+cover(b)+
        (pct?'<div class="progress"><i style="width:'+pct+'%"></i></div>':'')+
        '<div class="title">'+esc(b.title)+'</div><div class="meta">'+esc((b.authors||[]).join(', ')||'—')+'</div><div class="meta">'+b.chapters+' bob · ~'+Math.max(1,Math.round(b.minutes/60))+' soat'+(pct?' · '+pct+'%':'')+'</div></a>';
    }).join('');
    // Continue reading: most recently read.
    var last=null, lastAt=0;
    books.forEach(function(b){var pr=progress(b.id); if(pr.pos&&(pr.updatedAt||1)>=lastAt&&pr.percent<0.999){last=b;lastAt=pr.updatedAt||1}});
    var cont=document.getElementById('cont');
    if(last&&!q){var pr=progress(last.id);cont.innerHTML='<a class="continue" href="reader.html?book='+encodeURIComponent(last.id)+'">'+cover(last)+'<div style="flex:1;min-width:0"><small>Davom ettirish</small><b>'+esc(last.title)+'</b><div class="progress"><i style="width:'+Math.round((pr.percent||0)*100)+'%"></i></div></div></a>'}else cont.innerHTML='';
  }
  document.getElementById('q').addEventListener('input',function(e){render(e.target.value)});
  render('');
})();
</script>
</body>
</html>
